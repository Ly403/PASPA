pose_fps: 30
joints: 55
train:
  target: diffusion.data.datasets.beat2.beat_sep_lower.BEAT2Dataset
  params:
    loader_type: "train"
    data_path: ${data.data_path}
    data_path_1: ${data.data_path_1}
    root_path: ${data.root_path}
    cache_path: ".cache/"
    stride: 20
    pose_length: ${data.pose_length}
    pose_fps: ${data.pose_fps}
    audio_sr: ${data.audio_sr}
    audio_fps: ${data.audio_fps}
    test_length: ${data.test_length}
    multi_length_training:
      - 1.0
    ori_joints: "beat_smplx_joints"
    tar_joints: "beat_smplx_full"
    pose_rep: "smplxflame_30"
    word_rep: "textgrid"
    facial_rep: "smplxflame_30"
    audio_rep: "wave16k"
    id_rep: "onehot"
    emo_rep: null
    sem_rep: null
    audio_norm: false
    facial_norm: false
    pose_norm: false
    additional_data: false
    training_speakers: ${data.training_speakers}
    beat_align: true
    t_pre_encoder: ${data.t_pre_encoder}
    new_cache: false
    word_cache: false
    disable_filtering: false
    clean_first_seconds: 0
    clean_final_seconds: 0
    build_cache: true
