# 这些是受到create_h5.py的影响，手动填入，要和h5文件对应的配置参数一致
audio_sr: 16000
audio_fps: 16000
pose_length: 256
pose_fps: 30
data_path_1: "/remote-home/liuyi/Sana/tools/EMAGE/emage_evaltools"
joints: 55
local: True
readahead: False

train:
  target: diffusion.data.datasets.beat2.BEATXDataset.LMDBDataset
  params:
    lmdb_path: /root/tmp/train/train_seq_size_256_stride_size_20_local.lmdb
    rotation_method: axisangle
    use_symmetry_aug: false
    readahead: ${data.readahead}

validation:
  target: diffusion.data.datasets.beat2.BEATXDataset.LMDBDataset
  params:
    lmdb_path: /remote-home/liuyi/Sana/.cache/val/val_seq_size_256_stride_size_20_local.lmdb
    rotation_method: axisangle
    use_symmetry_aug: false
    readahead: True

test:
  target: diffusion.data.datasets.beat2.BEATXDataset.LMDBDataset
  params:
    lmdb_path: /remote-home/liuyi/Sana/.cache/test/test_seq_size_256_stride_size_20_local_ids_2.lmdb
    rotation_method: axisangle
    use_symmetry_aug: false
    readahead: True

