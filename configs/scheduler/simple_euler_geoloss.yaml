train_sampling_steps: 1000
scheduler:
  prediction_type: xstart
  noise_schedule: linear_flow
  loss_type: mot_geo_exp_mse
  pred_sigma: False
  learn_sigma: False
  flow_shift: 1.0
  task: ${train.task}
  lambda_motion: 10.0
  lambda_expression: 1.0
  other_lambdas:
    lambda_vel: 0.0
    lambda_vel_rcxyz: 0.0
    lambda_rcxyz: 0.0
    lambda_fc: 0.0

overlap_length: 8
# logit-normal timestep
weighting_scheme: logit_normal
logit_mean: 0.0
logit_std: 1.0

sampler:
  target: diffusion.sampler.flow_euler_sampler.SimpleFlowEulerSampler
  params:
    steps: 10
    task: ${train.task}
    prediction_type: ${scheduler.scheduler.prediction_type}
