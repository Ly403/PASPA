# @package _global_
defaults:
  - override /data: show_global_256_lmdb_talkshow_face
  - _self_

# Existing canonical TalkSHOW contract: 256 frames = 4 blocks x 64 frames.
talkshow_profile:
  name: block64_seq256
  identity_contract: raw21_24_to_model0_3
  raw_pid_min: 21
  raw_pid_max: 24
  model_pid_min: 0
  model_pid_max: 3
  seq_size: 256
  block_size: 64
  stride_size: 20
name: paspa_talkshow_block64_seq256

data:
  pose_length: 256
  train_batch_size: 72
  train:
    params:
      lmdb_path: ${oc.env:SHOW_LMDB_DIR}/show_train_seq_size_256_stride_size_20_global.lmdb
      expected_seq_size: 256
  validation:
    params:
      lmdb_path: ${oc.env:SHOW_LMDB_DIR}/show_val_seq_size_256_stride_size_20_global.lmdb
      expected_seq_size: 256
  test:
    params:
      lmdb_path: ${oc.env:SHOW_LMDB_DIR}/show_test_seq_size_256_stride_size_20_global.lmdb
      expected_seq_size: 256

model:
  speech_model:
    params:
      expected_pose_length: 256
      expected_block_size: 64

train:
  teacher_forcing: true
  num_frame_per_block: 64
  independent_first_frame: false
  finetune_speech_model: false
  num_epochs: 1000
  save_model_epochs: 10
  check_eval_n_epochs: 5
