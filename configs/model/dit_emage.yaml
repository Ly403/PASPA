model:
  target: diffusion.model.nets.dit.DiffusionDITNetPartsFixedExpressions2PostNormGuider
  params:
    hidden_size: 384
    num_layers: 6
    num_person: 31

model_wrapper:
  target: diffusion.model.denoiser.wrapper.DenoiserWrapper

speech_model_ckpt_path: /remote-home/liuyi/Sana/tools/best.pt
speech_model:
  target: diffusion.model.nets.basic_modules.SimpleSpeechModel
  params:
    feature_dim: 512
    output_feat_dim: 100
    num_person: 31


guider:
  guider_type: identity
  cfg_schedule_type: interval
  cfg_schedule_kwargs:
    start: 100
    end: 600
    outside_scale: 1.0
  ucg_prob: 0.1
  cfg_motion_scale: 7.5

resume_from: null
load_from: null
autocast_linear_attn: false
fp32_attention: true
mixed_precision: 'no'
