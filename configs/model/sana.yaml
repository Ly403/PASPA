model:
  target: diffusion.model.nets.sana_triple_stream.SanaTripleStream
  params:
    motion_in_channels: 337
    expression_in_channels: 100
    audio_in_channels: ${audio.mel_spec.n_mel_channels}
    hidden_size: 256
    caption_channels: 300
    depth: 8
    drop_path: 0.2
    inputlayer_config:
      target: diffusion.model.nets.basic_modules.InputLayer
      params:
        bias: true
        norm_type: rms
        proj_type: linear
        norm_eps: 1e-6
    timestep_embedder_config:
      target: diffusion.model.nets.basic_modules.TimestepEmbedder
      params:
        frequency_embedding_size: 256
        bias: true
    caption_embedder_config:
      target: diffusion.model.nets.basic_modules.EMAGECaptionEmbedder
      params:
        lang_model_path: ${data.data_path}
        text_fix_pretrained: false
        y_proj_type: mlp
        act_type: gelu
        y_norm_type: rms
        bias: true
        droput: 0.0
        norm_eps: 1e-6
    block_config:
      target: diffusion.model.nets.sana_triple_stream.SanaTripleStreamBlock
      params:
        num_heads: 8
        head_dim: null
        simple_modulation: false
        bias: true
        norm_type: rms
        attn_type: linear
        qk_norm_type: identity
        cross_attn_type: linear
        cross_qk_norm_type: identity
        ffn_type: mlp
        ffn_act_type: gelu
        ffn_proj_type: linear
        ffn_mlp_ratio: 2.0
        attn_drop: 0.0
        attn_proj_drop: 0.0
        cross_attn_drop: 0.0
        cross_attn_proj_drop: 0.0
        ffn_drop: 0.0
        drop_path: 0.0
        norm_eps: 1e-6
    finallayer_config:
      target: diffusion.model.nets.basic_modules.FinalLayer
      params:
        bias: true
        norm_type: rms
        proj_type: linear
        simple_modulation: false
        norm_eps: 1e-6
    work_dir: ${work_dir}
    use_pe: false
    pos_embed_type: null
    pe_max_length: 10000
    simple_modulation: false

guider:
  guider_type: classifier-free
  ucg_prob: 0.1
  motion_scale: 4.5
  expression_scale: 4.5
  audio_scale: 4.5
  max_training_steps: ${scheduler.train_sampling_steps}

resume_from: null
load_from: null
autocast_linear_attn: false
fp32_attention: true
mixed_precision: 'no'
