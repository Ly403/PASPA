model:
  target: diffusion.model.nets.causal.causal_mmdit.CausalMMDITEmage
  params:
    motion_in_channels: 337
    expression_in_channels: 100
    hidden_size: 256
    caption_channels: 1024
    depth: 4
    drop_path: 0.0
    is_teacher_forcing: True
    inputlayer_config:
      target: diffusion.model.nets.basic_modules.InputLayer
      params:
        bias: true
        norm_type: rms
        proj_type: linear
        norm_eps: 1e-6
    timestep_embedder_config:
      target: diffusion.model.nets.basic_modules.TimestepEmbedder
      params:
        frequency_embedding_size: 768
        bias: true
    caption_embedder_config:
      target: diffusion.model.nets.basic_modules.CaptionEmbedder
      params:
        y_proj_type: mlp
        act_type: gelu
        y_norm_type: rms
        bias: true
        droput: 0.0
        norm_eps: 1e-6
    block_config:
      target: diffusion.model.nets.causal.causal_mmdit.CausalMMDITBlock
      params:
        num_heads: 8
        head_dim: null
        simple_modulation: false
        bias: true
        norm_type: rms
        attn_type: flash
        qk_norm_type: identity
        cross_attn_type: flash
        cross_qk_norm_type: identity
        ffn_type: mlp
        ffn_act_type: gelu
        ffn_proj_type: linear
        ffn_mlp_ratio: 4.0
        attn_drop: 0.0
        attn_proj_drop: 0.0
        cross_attn_drop: 0.0
        cross_attn_proj_drop: 0.0
        ffn_drop: 0.0
        drop_path: 0.0
        norm_eps: 1e-6
        is_teacher_forcing: ${model.model.params.is_teacher_forcing}
        local_attn_size: ${model.local_attn_size}
        max_attention_size: ${model.max_attention_size}
    finallayer_config:
      target: diffusion.model.nets.causal.causal_block.FinalLayer
      params:
        bias: true
        norm_type: rms
        proj_type: linear
        norm_eps: 1e-6
    work_dir: ${work_dir}
    use_pe: True
    pos_embed_type: rope
    pe_max_length: 10000
    simple_modulation: True
    num_frame_per_block: ${train.num_frame_per_block}
    independent_first_frame: ${train.independent_first_frame}

local_attn_size: 512
max_attention_size: 512

speech_model_ckpt_path: /remote-home/liuyi/Sana/tools/best.pt
speech_model:
  target: diffusion.model.nets.basic_modules.SimpleSpeechModel
  params:
    feature_dim: 512
    output_feat_dim: 100
    num_person: 31

guider:
  guider_type: identity
  ucg_prob: 0.0
  cfg_audio_scale: 0.0
  cfg_history_scale: 0.0
  cfg_schedule_type: constant
  cfg_schedule_kwargs: {}

resume_from: null
load_from: null
autocast_linear_attn: false
fp32_attention: true
mixed_precision: 'no'
